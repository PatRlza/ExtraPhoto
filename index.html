<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ExtraPhoto</title>
<style>
:root{color-scheme:light dark;
--bg:#f8f9fb;--surf:#eef1f6;--card:#fff;--on:#191c20;--on2:#43474e;--pri:#2b5fb4;--onpri:#fff;--sec:#d8e2ff;--onsec:#001a41;--out:#c3c6d0;--err:#ba1a1a}
:root[data-theme=dark]{color-scheme:dark;--bg:#111318;--surf:#1d2025;--card:#23272d;--on:#e2e2e9;--on2:#c3c6d0;--pri:#aec6ff;--onpri:#002e69;--sec:#2f4578;--onsec:#d8e2ff;--out:#43474e;--err:#ffb4ab}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]):not([data-theme=dark]){--bg:#111318;--surf:#1d2025;--card:#23272d;--on:#e2e2e9;--on2:#c3c6d0;--pri:#aec6ff;--onpri:#002e69;--sec:#2f4578;--onsec:#d8e2ff;--out:#43474e;--err:#ffb4ab}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--on);font:15px/1.45 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:18px 20px 8px;max-width:1100px;margin:auto}
h1{font-size:24px;font-weight:500;margin:0}
h2{font-size:15px;font-weight:500;margin:0 0 12px}
main{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:16px;padding:8px 20px 28px;max-width:1100px;margin:auto;align-items:start}
@media(max-width:760px){main{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:28px;padding:18px;margin-bottom:16px}
.seg{display:flex;background:var(--surf);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;color:var(--on2);padding:8px 12px;border-radius:999px;font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--sec);color:var(--onsec);font-weight:500}
#theme{margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--surf);color:var(--on);border-radius:16px;padding:8px 12px;font:inherit;cursor:pointer;text-align:left}
.chip small{display:block;color:var(--on2);font-size:11px}
.chip[aria-pressed=true]{background:var(--sec);color:var(--onsec)}
.stack{display:flex;flex-direction:column;gap:6px}
.stack button{border:0;background:var(--surf);color:var(--on);border-radius:18px;padding:11px 16px;font:inherit;cursor:pointer;text-align:left}
.stack button[aria-pressed=true]{background:var(--sec);color:var(--onsec);font-weight:500}
.row{display:flex;gap:10px;align-items:center;margin:12px 0 0}
.row>label{flex:1}
label.f{display:block;font-size:12px;color:var(--on2)}
input[type=number],input[type=text]{width:100%;margin-top:4px;padding:11px 14px;border-radius:16px;border:0;background:var(--surf);color:var(--on);font:inherit}
input[type=text]{margin:0;padding:8px 12px;border-radius:14px}
input:focus-visible,button:focus-visible,.drop:focus-visible,a:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--pri)}
input[type=color]{width:48px;height:40px;border:0;border-radius:14px;background:none;padding:0;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:2px solid var(--out);border-radius:14px}
input[type=color]::-moz-color-swatch{border:2px solid var(--out);border-radius:14px}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:2px solid var(--on2);border-radius:7px;background:none;display:grid;place-content:center;cursor:pointer;flex:none;margin:0}
input[type=checkbox]:checked{background:var(--pri);border-color:var(--pri)}
input[type=checkbox]:checked::after{content:"";width:10px;height:5px;border:solid var(--onpri);border-width:0 0 2px 2px;transform:rotate(-45deg) translate(1px,-1px)}
.sw{display:flex;gap:12px;align-items:flex-start;font-size:14px}
.sw small{display:block;color:var(--on2)}
.btn{border:0;border-radius:999px;padding:10px 20px;font:inherit;font-weight:500;cursor:pointer;background:var(--pri);color:var(--onpri);text-decoration:none;text-align:center;display:inline-block}
.btn.t{background:var(--sec);color:var(--onsec)}
.btn.d{background:var(--err);color:var(--bg)}
.btn:disabled{opacity:.4;cursor:default}
.drop{display:block;border:2px dashed var(--out);border-radius:28px;padding:30px 16px;text-align:center;cursor:pointer;color:var(--on2);background:var(--card)}
.drop.over{border-color:var(--pri);background:var(--sec);color:var(--onsec)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 0;background:var(--card);border-radius:999px;padding:8px 12px 8px 18px}
.bar .grow,.grow{flex:1}
.bar .btn{padding:8px 16px}
.item{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--card);border-radius:28px;padding:12px 14px;margin-top:12px}
.item{position:relative}.item.drag{z-index:5;box-shadow:0 8px 24px #0006;opacity:.92}.item.db{box-shadow:0 -4px 0 0 var(--pri)}.item.da{box-shadow:0 4px 0 0 var(--pri)}
.hd{touch-action:none;cursor:grab;color:var(--on2);font-size:20px;line-height:1;padding:8px 4px;user-select:none}
.no{min-width:22px;font-weight:500;color:var(--on2);text-align:center}
.item img{width:84px;height:84px;object-fit:contain;background:var(--surf);border-radius:18px;cursor:pointer}
.mid{flex:1;min-width:160px}
.nmr{display:flex;align-items:center;gap:6px}
.nmr span{color:var(--on2)}
.m{color:var(--on2);font-size:13px;margin-top:4px}
.acts{display:flex;flex-direction:column;gap:6px}
.acts .btn{padding:7px 16px;font-size:13px}
.meta{flex-basis:100%;background:var(--surf);border-radius:20px;padding:12px 14px;font-size:13px;display:none}
.meta.open{display:block}
.meta table{width:100%;border-collapse:collapse}
.meta td{padding:2px 6px 2px 0;vertical-align:top;word-break:break-word}
.meta td:first-child{color:var(--on2);white-space:nowrap}
.warn{color:var(--err);font-weight:500}
.ok{color:var(--on2)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:12px;z-index:9;opacity:0;transition:opacity .2s ease}.ov.show{opacity:1}
.dlg{background:var(--card);border-radius:28px;padding:16px;width:min(1000px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;transform:translateY(28px) scale(.95);transition:transform .28s cubic-bezier(.2,.8,.2,1)}.ov.show .dlg{transform:none}@media(prefers-reduced-motion:reduce){.ov,.dlg{transition:none}}
.tb{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tb .seg{flex:1 1 420px}.btn.sm{padding:6px 14px}.lk{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:var(--surf);color:var(--on2);cursor:pointer;display:grid;place-items:center;padding:0}.lk[aria-pressed=true]{background:var(--sec);color:var(--onsec)}.lk .sl{display:block}.lk[aria-pressed=true] .sl{display:none}.row.end{align-items:flex-end}
.tb label.f{min-width:140px}
.stage{height:min(58vh,620px);overflow:auto;background:var(--surf);border-radius:20px;display:flex;padding:8px;flex:none}
#cv{margin:auto;flex:none;touch-action:none;border-radius:8px;cursor:crosshair;background:repeating-conic-gradient(#8883 0 25%,#0000 0 50%) 0 0/16px 16px}
.hint{margin:0;color:var(--on2);font-size:13px}
</style>
</head>
<body>
<header><h1>ExtraPhoto</h1></header>
<main>
  <section>
    <div class="seg" id="theme" role="group" aria-label="Тема">
      <button data-t="auto">Авто</button><button data-t="light">Светлая</button><button data-t="dark">Тёмная</button>
    </div>
    <div class="card">
      <h2>Готовые размеры</h2>
      <div class="chips" id="presets"></div>
      <div class="row">
        <label class="f">Ширина, px<input id="w" type="number" min="1" max="8000" value="1080"></label>
        <label class="f">Высота, px<input id="h" type="number" min="1" max="8000" value="1920"></label>
      </div>
      <div class="row end">
        <label class="f">Соотношение, ширина<input id="ra" type="text" inputmode="decimal" autocomplete="off"></label>
        <button class="lk" id="lk" aria-pressed="true" title="Связать: ширина и высота держат соотношение" aria-label="Связать соотношение"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/><path class="sl" d="M4 4L20 20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></button>
        <label class="f">Соотношение, высота<input id="rb" type="text" inputmode="decimal" autocomplete="off"></label>
      </div>
      <div class="m" id="rhint"></div>
    </div>
    <div class="card">
      <h2>Как вписать</h2>
      <div class="stack" data-g="fit" id="gfit"></div>
      <div class="row"><span class="f grow">Цвет полей</span><input id="bg" type="color" value="#ffffff"></div>
      <h2 style="margin-top:18px">Формат</h2>
      <div class="seg" data-g="fmt" id="gfmt"></div>
      <label class="f" id="qrow" style="margin-top:12px">Качество: <span id="qv">92</span>%<input id="q" type="range" min="40" max="100" value="92"></label>
    </div>
    <div class="card">
      <h2>Метаданные</h2>
      <label class="sw"><input id="keep" type="checkbox"><span>Сохранить EXIF в JPEG<small>По умолчанию всё стирается: GPS, камера, дата, скрытые данные. Если включить, GPS тоже останется.</small></span></label>
    </div>
  </section>
  <section>
    <label class="drop" id="drop" tabindex="0">
      Перетащите фото сюда или нажмите, чтобы выбрать
      <input id="file" type="file" accept="image/*" multiple hidden>
    </label>
    <div class="bar" id="bar" hidden>
      <label class="sw"><input id="all" type="checkbox">Все</label>
      <span class="m grow" id="count"></span>
      <button class="btn d" id="del" disabled>Удалить</button>
      <button class="btn" id="zip">Скачать ZIP</button>
    </div>
    <div id="list"></div>
  </section>
</main>

<div class="ov" id="ed" hidden>
  <div class="dlg" role="dialog" aria-label="Правка фото">
    <div class="tb">
      <div class="seg" id="tools"><button data-k="frame">Кадр</button><button data-k="brush">Кисть</button><button data-k="sel">Выделение</button><button data-k="pick">Пипетка</button><button data-k="hand">Рука</button></div>
      <input id="ec" type="color" value="#000000" aria-label="Цвет">
      <label class="f grow">Толщина кисти: <span id="ewv">40</span><input id="ew" type="range" min="2" max="300" value="40"></label>
      <label class="sw"><input id="ecopy" type="checkbox">Копировать</label>
    </div>
    <div class="stage"><canvas id="cv"></canvas></div>
    <div class="tb"><button class="btn t sm" id="zout" aria-label="Уменьшить">−</button><input id="ez" type="range" min="1" max="10" step="0.05" value="1" class="grow" aria-label="Масштаб"><button class="btn t sm" id="zin" aria-label="Увеличить">+</button><span class="m" id="zv" style="min-width:46px">100%</span><button class="btn t sm" id="zfit">Вместить</button></div>
    <p class="hint" id="hint"></p>
    <div class="tb">
      <button class="btn t" id="eundo">Отменить</button>
      <button class="btn t" id="edel">Удалить фрагмент</button>
      <span class="grow"></span>
      <button class="btn t" id="ecancel">Отмена</button>
      <button class="btn" id="eok">Готово</button>
    </div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kb=n=>n>1048576?(n/1048576).toFixed(1)+' МБ':Math.round(n/1024)+' КБ';
const S={fit:'cover',fmt:'image/png'};let R=[1080,1920],link=true;
const EXT={'image/png':'png','image/jpeg':'jpg','image/webp':'webp'};
// ---- тема
const root=document.documentElement;
function setTheme(t){try{localStorage.setItem('theme',t)}catch(e){}
 if(t==='auto')root.removeAttribute('data-theme');else root.dataset.theme=t;
 document.querySelectorAll('#theme button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t))}
document.querySelectorAll('#theme button').forEach(b=>b.onclick=()=>setTheme(b.dataset.t));
let st='auto';try{st=localStorage.getItem('theme')||'auto'}catch(e){}setTheme(st);
// ---- настройки
const PRE=[["1080×1920","9:16 RuStore",1080,1920],["1920×1080","16:9 горизонт",1920,1080],["1080×2400","9:20",1080,2400],["1440×2560","9:16 QHD",1440,2560],["720×1280","9:16 малый",720,1280],["1080×1080","1:1",1080,1080],["512×512","иконка",512,512],["1024×500","баннер",1024,500],["1200×630","соцсети",1200,630]];
const pc=$('#presets');
PRE.forEach(([n,d,w,h])=>{const b=document.createElement('button');b.className='chip';b.innerHTML=n+'<small>'+d+'</small>';b.dataset.w=w;b.dataset.h=h;
 b.onclick=()=>{R=[w,h];$('#w').value=w;$('#h').value=h;showR();mark();run()};pc.append(b)});
function mark(){pc.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.w==$('#w').value&&b.dataset.h==$('#h').value))}
function group(el,key,opts){opts.forEach(([v,l])=>{const b=document.createElement('button');b.textContent=l;b.dataset.v=v;b.onclick=()=>{S[key]=v;sync();run()};el.append(b)})}
function sync(){document.querySelectorAll('[data-g]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S[g.dataset.g])));$('#qrow').hidden=S.fmt==='image/png'}
group($('#gfit'),'fit',[['cover','Заполнить и обрезать края'],['contain','Вписать целиком, поля цветом'],['stretch','Растянуть (искажает)']]);
group($('#gfmt'),'fmt',[['image/png','PNG'],['image/jpeg','JPEG'],['image/webp','WebP']]);
mark();sync();
// ---- EXIF
const TAGS={0x010f:'Производитель',0x0110:'Модель',0x0112:'Ориентация',0x0131:'Программа',0x0132:'Дата',0x013b:'Автор',0x8298:'Копирайт',0x010e:'Описание',0x9003:'Дата съёмки',0x9004:'Дата оцифровки',0xa430:'Владелец камеры',0xa431:'Серийный № камеры',0xa433:'Объектив',0xa434:'Модель объектива',0x927c:'MakerNote',0x9286:'Комментарий',0xa420:'ID изображения',0x829a:'Выдержка',0x829d:'Диафрагма',0x8827:'ISO',0x920a:'Фокусное',0x9c9b:'XP Заголовок',0x9c9c:'XP Комментарий',0x9c9d:'XP Автор',0x9c9e:'XP Ключевые слова',0x9c9f:'XP Тема'};
const GPST={1:'GPS: N/S',2:'GPS: широта',3:'GPS: E/W',4:'GPS: долгота',5:'GPS: высота ref',6:'GPS: высота',7:'GPS: время',12:'GPS: ед. скорости',13:'GPS: скорость',16:'GPS: направление ref',17:'GPS: направление',29:'GPS: дата',27:'GPS: метод',28:'GPS: область'};
function parseMeta(buf){
 const v=new DataView(buf),u=new Uint8Array(buf),out={rows:[],gps:null,segs:[],exifSeg:null,oriPos:-1};
 const add=(k,val,flag)=>out.rows.push([k,val,flag]);
 if(v.getUint16(0)===0xffd8){
  let p=2;
  while(p<v.byteLength-4){
   if(v.getUint8(p)!==0xff)break;const m=v.getUint8(p+1);if(m===0xda||m===0xd9)break;
   const len=v.getUint16(p+2),s=p+4,e=p+2+len;
   const id=String.fromCharCode(...u.slice(s,s+Math.min(30,len-2)));
   if(m===0xe1&&id.startsWith('Exif\0\0')){out.segs.push('EXIF');out.exifSeg=[p,e];tiff(v,s+6,out,add)}
   else if(m===0xe1&&id.includes('ns.adobe.com/xap'))out.segs.push('XMP');
   else if(m===0xed)out.segs.push('IPTC / Photoshop');
   else if(m===0xfe){out.segs.push('Комментарий');add('Комментарий JPEG',new TextDecoder().decode(u.slice(s,e)).slice(0,200),1)}
   else if(m===0xe2&&id.startsWith('ICC'))out.segs.push('ICC-профиль');
   else if(m>=0xe1&&m<=0xef)out.segs.push('APP'+(m-0xe0)+' ('+len+' Б)');
   p=e}
 }else if(u[0]===0x89&&u[1]===0x50){
  let p=8;const names=[];
  while(p<u.length-8){const l=v.getUint32(p),n=String.fromCharCode(...u.slice(p+4,p+8));
   if(['tEXt','iTXt','zTXt','eXIf'].includes(n)){names.push(n);if(n==='tEXt')add('PNG текст',new TextDecoder('latin1').decode(u.slice(p+8,p+8+Math.min(l,300))).replace('\0',': '),1)}
   if(n==='IEND')break;p+=12+l}
  out.segs=names.length?['PNG-блоки: '+names.join(', ')]:[];
 }else if(String.fromCharCode(...u.slice(0,4))==='RIFF'){
  let p=12;const names=[];
  while(p<u.length-8){const n=String.fromCharCode(...u.slice(p,p+4)),l=v.getUint32(p+4,true);if(n==='EXIF'||n==='XMP ')names.push(n.trim());p+=8+l+(l&1)}
  out.segs=names;
 }
 return out}
function tiff(v,base,out,add){
 const le=v.getUint16(base)===0x4949,g16=o=>v.getUint16(o,le),g32=o=>v.getUint32(o,le);
 const sz={1:1,2:1,3:2,4:4,5:8,7:1,9:4,10:8};
 function val(t,c,o){const n=sz[t]*c;const a=n>4?base+g32(o+8):o+8;
  if(t===2){let s='';for(let i=0;i<c-1&&i<300;i++)s+=String.fromCharCode(v.getUint8(a+i));return s}
  const r=[];for(let i=0;i<Math.min(c,6);i++){
   if(t===3)r.push(g16(a+i*2));else if(t===4)r.push(g32(a+i*4));else if(t===1||t===7)r.push(v.getUint8(a+i));
   else if(t===9)r.push(v.getInt32(a+i*4,le));
   else if(t===5||t===10){const n=t===5?g32(a+i*8):v.getInt32(a+i*8,le),d=g32(a+i*8+4);r.push(d?n/d:0)}}
  return c>6?r.join(', ')+'…':r.join(', ')}
 function ifd(off,kind){const a=base+off,n=g16(a),g={};
  for(let i=0;i<n;i++){const o=a+2+i*12,tag=g16(o),t=g16(o+2),c=g32(o+4);if(!sz[t])continue;
   if(kind==='ifd'&&tag===0x8769){ifd(g32(o+8),'ifd');continue}
   if(kind==='ifd'&&tag===0x8825){ifd(g32(o+8),'gps');continue}
   if(kind==='ifd'&&tag===0x0112)out.oriPos=o+8;
   if(kind==='gps'){g[tag]=val(t,c,o);if(GPST[tag]&&tag!==2&&tag!==4)add(GPST[tag],String(g[tag]),1);continue}
   if(tag===0x927c){add('MakerNote (данные производителя)',c+' байт',1);continue}
   if(TAGS[tag]){let x=val(t,c,o);if(tag>=0x9c9b&&tag<=0x9c9f){x=String.fromCharCode(...Array.from({length:Math.min(c/2,150)},(_,k)=>v.getUint16(base+g32(o+8)+k*2,true))).replace(/\0/g,'')}
    add(TAGS[tag],String(x),[0x0132,0x9003,0x9004,0x010f,0x0110,0xa431,0xa430,0x013b,0x0131,0x9c9d].includes(tag))}}
  if(kind==='gps'&&g[2]&&g[4]){const f=(a,r)=>{const x=String(a).split(', ').map(Number);return (x[0]+x[1]/60+x[2]/3600)*(/[SW]/.test(r)?-1:1)};
   const la=f(g[2],g[1]),lo=f(g[4],g[3]);out.gps=[la,lo]}
  return a}
 ifd(g32(base+4),'ifd')}

// ---- список и обработка
const items=[];let uid=0;
const fname=(it,i)=>((it.custom||'').trim().replace(/[\\/:*?"<>|]/g,'_')||String(i+1))+'.'+(it.ext||'png');
async function process(it){
 const W=+$('#w').value,H=+$('#h').value,fmt=S.fmt,fit=S.fit,src=it.src;
 const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
 x.imageSmoothingQuality='high';

 $('#lk').setAttribute('aria-pressed',link);$('#rhint').textContent=link?'Связь включена: ширина и высота меняются вместе.':'Связь выключена: ширина и высота независимы.'}
function ratioIn(){const a=num($('#ra').value),b=num($('#rb').value);if(a>0&&b>0){R=[a,b];$('#h').value=clampPx($('#w').value*b/a);mark();run()}}
$('#ra').oninput=$('#rb').oninput=ratioIn;
$('#lk').onclick=()=>{link=!link;if(link)R=[+$('#w').value||1,+$('#h').value||1];showR()};
$('#w').oninput=()=>{if(link)$('#h').value=clampPx($('#w').value*R[1]/R[0]);else R=[+$('#w').value,+$('#h').value],showR();mark();run()};
$('#h').oninput=()=>{if(link)$('#w').value=clampPx($('#h').value*R[0]/R[1]);else R=[+$('#w').value,+$('#h').value],showR();mark();run()};
showR();
['bg','keep'].forEach(i=>$('#'+i).onchange=run);
$('#q').oninput=()=>{$('#qv').textContent=$('#q').value;run()};
addEventListener('paste',e=>{const f=[...e.clipboardData.files];if(f.length&&!E)addFiles(f)});
</script>
</body>
</html>
